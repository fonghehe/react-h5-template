openapi: 3.1.0
info:
  title: React H5 Template API
  version: 2.0.0
servers:
  - url: /api
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
  /auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Logged out
  /user:
    get:
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
  /products:
    get:
      operationId: getProducts
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductPage'
  /products/{id}:
    get:
      operationId: getProduct
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          description: Product detail
  /ai/chat:
    post:
      operationId: chat
      description: Demonstration SSE stream. Validation errors use the JSON API envelope before streaming starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE events start, delta, finish, followed by [DONE]
          content:
            text/event-stream:
              schema: { type: string }
        '400':
          description: Invalid chat request; JSON API envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    ApiEnvelope:
      type: object
      required: [code, data, message, requestId]
      properties:
        code: { type: integer }
        data: {}
        message: { type: string }
        requestId: { type: string, format: uuid }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 6 }
    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [id, role, content]
            properties:
              id: { type: string, minLength: 1, maxLength: 100 }
              role: { type: string, enum: [assistant, user] }
              content: { type: string, maxLength: 1000 }
    User:
      type: object
      required: [id, username, realName, avatar, roles]
      properties:
        id: { type: integer }
        username: { type: string }
        realName: { type: string }
        avatar: { type: string, format: uri }
        roles:
          type: array
          items: { type: string }
    LoginResult:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [accessToken]
          properties:
            accessToken: { type: string }
    Product:
      type: object
      required:
        [id, title, imageUrl, price, memberPrice, shopName, shopBadge, delivery, description]
      properties:
        id: { type: integer }
        title: { type: string }
        imageUrl: { type: string, format: uri }
        price: { type: number }
        memberPrice: { type: number }
        shopName: { type: string }
        shopBadge: { type: string }
        delivery: { type: string }
        description: { type: string }
    ProductPage:
      type: object
      required: [items, page, pageSize, total, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }
